<!doctype html>
<!-- Entry page of the Setlist app: the app shell (product spec app-shell.md).
     Styles and fonts come with the app; the screens are rendered by src/main.js. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <!-- The browser's own bar matches --color-bg; a meta tag cannot use var(), so keep in sync with styles/tokens.css. -->
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
    <title>Setlist</title>
    <!-- Install (product spec install-offline.md): the manifest for browsers, the tags for the iPhone home screen. -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
    <meta name="apple-mobile-web-app-title" content="Setlist">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/songs-screen.css">
    <link rel="stylesheet" href="styles/song-screen.css">
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main id="app"></main>
  </body>
</html>
